name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Reads engines.node from package.json, so the range lives in one place.
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Offline: local OCR and saved answers only. No secrets, no .env, no network.
      - name: Check the sample data is up to date
        run: npm run precompute -- --check

      - name: Run the tests
        run: npm test

      - name: Build the site
        run: npm run build
        env:
          SITE_BASE: /facsimortis/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
